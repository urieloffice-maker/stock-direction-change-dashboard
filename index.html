<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דשבורד סיכונים ומדדי ייחוס</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            cursor: pointer;
        }
        .cards {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            flex: 1;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid #007bff;
        }
        .card h3 { margin: 0 0 8px 0; font-size: 14px; color: #666; }
        .card p { margin: 0; font-size: 22px; font-weight: bold; }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>דשבורד ניתוח מדדי ייחוס</h2>
        <div>
            <label for="benchmarkSelect"><b>בחר מדד ייחוס: </b></label>
            <select id="benchmarkSelect" onchange="renderDashboard()">
                <option value="S&P 500">S&P 500</option>
                <option value="NASDAQ">NASDAQ</option>
                <option value="QQQ">QQQ</option>
                <option value="Russell 2000">Russell 2000</option>
            </select>
        </div>
    </div>

    <div class="cards">
        <div class="card" style="border-color: #28a745;">
            <h3>תשואה מצטברת (שנתית)</h3>
            <p id="returnVal">0%</p>
        </div>
        <div class="card" style="border-color: #dc3545;">
            <h3>Max Drawdown (ירידה מרבית)</h3>
            <p id="drawdownVal">0%</p>
        </div>
        <div class="card" style="border-color: #17a2b8;">
            <h3>מחיר סגירה אחרון</h3>
            <p id="priceVal">$0</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="riskChart"></canvas>
    </div>

    <div class="footer" id="lastUpdated">עדכון אחרון: --</div>
</div>

<script>
let rawData = {};
let myChart = null;

async function loadData() {
    try {
        const response = await fetch('data.json');
        rawData = await response.json();
        document.getElementById('lastUpdated').innerText = 'עדכון אחרון: ' + (rawData.updated_at || 'לא ידוע');
        renderDashboard();
    } catch (e) {
        console.error("שגיאה בטעינת הנתונים:", e);
    }
}

function renderDashboard() {
    const selectedBenchmark = document.getElementById('benchmarkSelect').value;
    const benchmarkData = rawData.benchmarks ? rawData.benchmarks[selectedBenchmark] : [];

    if (!benchmarkData || benchmarkData.length === 0) return;

    // עדכון כרטיסיות
    const latest = benchmarkData[benchmarkData.length - 1];
    const minDrawdown = Math.min(...benchmarkData.map(d => d.drawdown));

    document.getElementById('returnVal').innerText = latest.cum_return + '%';
    document.getElementById('drawdownVal').innerText = minDrawdown.toFixed(2) + '%';
    document.getElementById('priceVal').innerText = '$' + latest.close;

    // עדכון גרף
    const labels = benchmarkData.map(d => d.date);
    const returns = benchmarkData.map(d => d.cum_return);
    const drawdowns = benchmarkData.map(d => d.drawdown);

    if (myChart) {
        myChart.destroy();
    }

    const ctx = document.getElementById('riskChart').getContext('2d');
    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'תשואה מצטברת (%)',
                    data: returns,
                    borderColor: '#007bff',
                    backgroundColor: 'rgba(0, 123, 255, 0.1)',
                    fill: true,
                    tension: 0.1
                },
                {
                    label: 'Drawdown (%)',
                    data: drawdowns,
                    borderColor: '#dc3545',
                    backgroundColor: 'rgba(220, 53, 69, 0.1)',
                    fill: true,
                    tension: 0.1
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { grid: { display: false } },
                y: { ticks: { callback: value => value + '%' } }
            }
        }
    });
}

loadData();
</script>
</body>
</html>
